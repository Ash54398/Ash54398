name: Generate snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=ff6a00&color_dots=#ebedf0,#d9c4ff,#a77bff,#7a3cf0,#ff6a00
            dist/snake-dark.svg?palette=github-dark&color_snake=ff6a00&color_dots=#161b22,#4b2a7a,#7a3cf0,#c9a9ff,#ff6a00

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
